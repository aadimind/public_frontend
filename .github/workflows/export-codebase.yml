name: Export Codebase

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate codebase.md
        shell: bash
        run: |
          {
            echo "# Codebase"
            echo
            find . -type f \
              ! -path './.git/*' \
              ! -path './node_modules/*' \
              ! -path './codebase.md' \
              | sort | while read file; do
                echo "---"
                echo
                echo "## \`$file\`"
                echo
                echo '```'
                cat "$file"
                echo
                echo '```'
                echo
              done
          } > codebase.md

      - name: Upload codebase.md
        uses: actions/upload-artifact@v4
        with:
          name: codebase
          path: codebase.md
