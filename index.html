<!doctype html>
<html lang="en" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0b0b" />

    <!-- Primary Meta Tags -->
    <title>Micromath — Understand the research that shapes tomorrow</title>
    <meta
      name="description"
      content="Clear, structured explanations of important research papers — without requiring you to decode every page of the original paper."
    />
    <meta name="author" content="Micromath" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://micromath.in/" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://micromath.in/" />
    <meta property="og:title" content="Micromath" />
    <meta
      property="og:description"
      content="Clear, structured explanations of important research papers."
    />
    <meta property="og:image" content="https://micromath.in/og-image.png" />
    <meta property="og:site_name" content="Micromath" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://micromath.in/" />
    <meta name="twitter:title" content="Micromath" />
    <meta
      name="twitter:description"
      content="Clear, structured explanations of important research papers."
    />
    <meta name="twitter:image" content="https://micromath.in/og-image.png" />

    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Serif+Pro:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- App entry point -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
